#
# OpenClaw
#
openclaw_user: openclaw
openclaw_group: openclaw
openclaw_shell: /usr/bin/fish
openclaw_home: /home/openclaw
openclaw_install_prefix: /opt/openclaw
openclaw_bin_path: /usr/bin/openclaw
openclaw_config_dir: "{{ openclaw_home }}/.openclaw"
openclaw_config_path: "{{ openclaw_config_dir }}/openclaw.json"
openclaw_state_dir: "{{ openclaw_config_dir }}"
openclaw_workspace_dir: "{{ openclaw_config_dir }}/workspace"
openclaw_update_channel: beta
openclaw_cli_version: beta
openclaw_model_primary: openai-codex/gpt-5.4
openclaw_gateway_token: "{{ vault_openclaw_gateway_token }}"
openclaw_telegram_bot_token: "{{ vault_openclaw_telegram_bot_token | default('') }}"
# allowlist (recommended) | open. groupAllowFrom should contain Telegram sender user IDs.
openclaw_telegram_group_policy: allowlist
# Telegram sender user IDs allowed to trigger OpenClaw in groups.
# Guard against accidental negative chat IDs here; group/supergroup IDs belong under
# openclaw_telegram_groups, not groupAllowFrom.
openclaw_telegram_group_allow_from: >-
  {{
    (vault_openclaw_telegram_group_allow_from | default([]))
    | reject('match', '^-')
    | list
  }}
# Telegram groups/supergroups allowed to message OpenClaw.
# Home Server is intentionally always-on for allowed senders (no @mention required).
# Additional groups can still be layered in via vault_openclaw_telegram_groups.
openclaw_telegram_groups: >-
  {{
    {'-5142684566': {'requireMention': false, 'allowFrom': ['5042629864']}}
    | combine(vault_openclaw_telegram_groups | default({}), recursive=True)
  }}
openclaw_gateway_manage_via_sudo: true

# Config keys managed via `openclaw config set` (merges into existing, preserves runtime values like pairing/allowlist).
# Omit paths that OpenClaw writes at runtime (e.g. channels.telegram.groups).
openclaw_config_overrides:
  - path: update.channel
    value: "{{ openclaw_update_channel }}"
  - path: agents.defaults.model.primary
    value: "{{ openclaw_model_primary }}"
  - path: agents.defaults.workspace
    value: "{{ openclaw_workspace_dir }}"
  - path: agents.defaults.maxConcurrent
    value: 6
    json: true
  - path: agents.defaults.subagents.maxConcurrent
    value: 8
    json: true
  - path: gateway.auth.mode
    value: token
  - path: gateway.auth.token
    value: "{{ openclaw_gateway_token }}"
  - path: channels.telegram.enabled
    value: true
    json: true
  - path: channels.telegram.groupPolicy
    value: "{{ openclaw_telegram_group_policy }}"
  - path: channels.telegram.groupAllowFrom
    value: "{{ openclaw_telegram_group_allow_from }}"
    json_array: true
  - path: channels.telegram.groups
    value: "{{ openclaw_telegram_groups }}"
    json: true
  - path: memory.backend
    value: qmd
  - path: memory.qmd.scope.default
    value: allow
  - path: skills.install.nodeManager
    value: bun
  - path: plugins.entries.telegram.enabled
    value: true
    json: true
  - path: channels.telegram.botToken
    value: "{{ openclaw_telegram_bot_token }}"

openclaw_skills_src_dir: "{{ playbook_dir }}/../skills"
openclaw_skills:
  - meetup-scheduler
  - blogwatcher
  - gog
openclaw_skills_env:
  MEETUP_SCHEDULER_CONFIG: "{{ openclaw_workspace_dir }}/private_config.json"
  GOG_ACCOUNT: "{{ vault_openclaw_gog_account }}"
  GOG_KEYRING_PASSWORD: "{{ vault_openclaw_gog_keyring_password }}"
  GOG_BIN: "{{ openclaw_install_prefix }}/bin/gog"
  BLOGWATCHER_BIN: "{{ openclaw_home }}/go/bin/blogwatcher"
openclaw_skill_configs:
  meetup-scheduler:
    path: "{{ openclaw_workspace_dir }}/private_config.json"
    template: skill-configs/meetup-scheduler-private_config.json.j2
openclaw_gog_credentials_src: "{{ playbook_dir }}/auth/client_secret.json"
openclaw_meetup_scheduler_timezone: "{{ timezone }}"
