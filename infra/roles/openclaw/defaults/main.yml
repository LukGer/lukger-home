---
openclaw_user: openclaw
openclaw_group: openclaw
openclaw_shell: /usr/bin/fish
openclaw_home: /home/openclaw
openclaw_config_dir: "{{ openclaw_home }}/.openclaw"
openclaw_config_path: "{{ openclaw_config_dir }}/openclaw.json"
openclaw_state_dir: "{{ openclaw_config_dir }}"
openclaw_workspace_dir: "{{ openclaw_config_dir }}/workspace"
openclaw_install_prefix: /opt/openclaw
openclaw_bin_path: "{{ openclaw_install_prefix }}/bin/openclaw"
openclaw_gateway_port: 18789
openclaw_gateway_bind: loopback
openclaw_update_channel: beta
openclaw_cli_version: beta
openclaw_gog_version: v0.12.0
openclaw_model_primary: openai-codex/gpt-5.2-codex
openclaw_gateway_token: ""
openclaw_telegram_bot_token: ""
openclaw_telegram_group_allow_from: []
openclaw_telegram_require_mention_in_groups: false
openclaw_gateway_manage_via_sudo: true
openclaw_gateway_systemctl_paths:
  - /bin/systemctl
  - /usr/bin/systemctl
# Skills
openclaw_skills_src_dir: "{{ playbook_dir }}/../skills"
openclaw_skills: []
# Env vars for skill execution (API keys, etc.)
openclaw_skills_env: {}
# Per-skill config files: skill_name -> { path, template }
openclaw_skill_configs: {}
# Config keys applied via `openclaw config set` (define in group_vars)
openclaw_config_overrides: []
