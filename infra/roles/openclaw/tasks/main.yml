---
- name: Ensure OpenClaw group exists
  ansible.builtin.group:
    name: "{{ openclaw_group }}"
    state: present

- name: Ensure OpenClaw user exists
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    home: "{{ openclaw_home }}"
    create_home: true
    shell: "{{ openclaw_shell | default('/bin/bash') }}"
    system: true

- name: Set openclaw password
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    password: "{{ vault_openclaw_password | password_hash('sha512') }}"
  when: vault_openclaw_password is defined

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - golang-go
    state: present
    update_cache: true

- name: Check whether OpenClaw CLI is already installed
  ansible.builtin.stat:
    path: "{{ openclaw_bin_path }}"
  register: stat_openclaw_bin

- name: Install OpenClaw via official installer (bundles Node.js)
  ansible.builtin.shell: |
    curl -fsSL --proto '=https' --tlsv1.2 https://openclaw.ai/install-cli.sh | bash -s -- --prefix {{ openclaw_install_prefix }} --version {{ openclaw_cli_version }} --no-onboard
  when: not stat_openclaw_bin.stat.exists

- name: Update existing OpenClaw CLI to requested version
  ansible.builtin.command:
    cmd: "{{ openclaw_bin_path }} update --tag {{ openclaw_cli_version }} --yes --no-restart"
  environment:
    HOME: "{{ openclaw_home }}"
    OPENCLAW_CONFIG_PATH: "{{ openclaw_config_path }}"
    PATH: "{{ openclaw_install_prefix }}/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
  when: stat_openclaw_bin.stat.exists
  changed_when: false
  notify: restart openclaw

- name: Ensure OpenClaw config and workspace dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0755'
  loop:
    - "{{ openclaw_config_dir }}"
    - "{{ openclaw_workspace_dir }}"
    - "{{ openclaw_workspace_dir }}/skills"
    - "{{ openclaw_home }}/.config/gogcli"

- name: Stat OpenClaw config for bootstrap check
  ansible.builtin.stat:
    path: "{{ openclaw_config_path }}"
  register: stat_openclaw_config
  become: true
  become_user: "{{ openclaw_user }}"

- name: Bootstrap OpenClaw config if missing
  ansible.builtin.copy:
    content: '{}'
    dest: "{{ openclaw_config_path }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0644'
  when: not stat_openclaw_config.stat.exists

- name: Apply OpenClaw config overrides via CLI (preserves runtime values)
  ansible.builtin.shell: |
    {{ openclaw_bin_path }} config set {{ item.path }} {% if item.get('json_array') %}{{ item.value | to_json | quote }}{% elif item.get('json') %}{{ item.value | string | lower }}{% else %}{{ item.value | string | quote }}{% endif %}{% if item.get('json') or item.get('json_array') %} --strict-json{% endif %}
  environment:
    HOME: "{{ openclaw_home }}"
    OPENCLAW_CONFIG_PATH: "{{ openclaw_config_path }}"
    PATH: "{{ openclaw_install_prefix }}/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
  loop: "{{ openclaw_config_overrides }}"
  when: >-
    (
      (item.path != 'channels.telegram.botToken')
      or (openclaw_telegram_bot_token | default('') | length > 0)
    )
    and (
      (item.path != 'channels.telegram.groupAllowFrom')
      or (openclaw_telegram_group_allow_from | default([]) | length > 0)
    )
  become: true
  become_user: "{{ openclaw_user }}"
  notify: restart openclaw

- name: Repair OpenClaw config schema drift with doctor --fix
  ansible.builtin.command:
    cmd: "{{ openclaw_bin_path }} doctor --fix --non-interactive"
  environment:
    HOME: "{{ openclaw_home }}"
    OPENCLAW_CONFIG_PATH: "{{ openclaw_config_path }}"
    PATH: "{{ openclaw_install_prefix }}/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
  become: true
  become_user: "{{ openclaw_user }}"
  changed_when: false
  notify: restart openclaw

- name: Validate OpenClaw config with doctor
  ansible.builtin.command:
    cmd: "{{ openclaw_bin_path }} doctor --non-interactive"
  environment:
    HOME: "{{ openclaw_home }}"
    OPENCLAW_CONFIG_PATH: "{{ openclaw_config_path }}"
    PATH: "{{ openclaw_install_prefix }}/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
  become: true
  become_user: "{{ openclaw_user }}"
  changed_when: false

- name: Install custom skills
  ansible.builtin.copy:
    src: "{{ openclaw_skills_src_dir }}/{{ item }}"
    dest: "{{ openclaw_workspace_dir }}/skills/{{ item }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0755'
  loop: "{{ openclaw_skills }}"
  when: openclaw_skills | length > 0
  notify: restart openclaw

- name: Ensure skill scripts are executable
  ansible.builtin.file:
    path: "{{ openclaw_workspace_dir }}/skills"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: "u=rwX,g=rX,o=rX"
    recurse: true
  when: openclaw_skills | length > 0

- name: Deploy skill config files
  ansible.builtin.template:
    src: "{{ item.value.template }}"
    dest: "{{ item.value.path }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0600'
  loop: "{{ openclaw_skill_configs | dict2items }}"
  when: openclaw_skill_configs | length > 0
  notify: restart openclaw

- name: Install gog CLI for OpenClaw skills
  ansible.builtin.unarchive:
    src: "https://github.com/steipete/gogcli/releases/download/{{ openclaw_gog_version }}/gogcli_{{ openclaw_gog_version | replace('v', '') }}_linux_{{ (ansible_architecture == 'x86_64') | ternary('amd64', 'arm64') }}.tar.gz"
    dest: "{{ openclaw_install_prefix }}/bin"
    remote_src: true
    creates: "{{ openclaw_install_prefix }}/bin/gog"
    extra_opts: [--strip-components=1]
  notify: restart openclaw

- name: Deploy gog credentials (vault-encrypted file)
  ansible.builtin.copy:
    src: "{{ openclaw_gog_credentials_src }}"
    dest: "{{ openclaw_home }}/.config/gogcli/credentials.json"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0600'
  notify: restart openclaw

- name: Install blogwatcher binary for OpenClaw user
  ansible.builtin.shell: |
    export GOPATH={{ openclaw_home }}/go
    export PATH=$PATH:{{ openclaw_home }}/go/bin
    go install github.com/Hyaxia/blogwatcher/cmd/blogwatcher@latest
  args:
    creates: "{{ openclaw_home }}/go/bin/blogwatcher"
  become: true
  become_user: "{{ openclaw_user }}"

- name: Initialize blogwatcher with xkcd feed
  ansible.builtin.shell: |
    export GOPATH={{ openclaw_home }}/go
    export PATH=$PATH:{{ openclaw_home }}/go/bin
    {{ openclaw_home }}/go/bin/blogwatcher add "xkcd" https://xkcd.com/rss.xml || true
    {{ openclaw_home }}/go/bin/blogwatcher scan
  args:
    creates: "{{ openclaw_home }}/.blogwatcher/blogwatcher.db"
  become: true
  become_user: "{{ openclaw_user }}"

- name: Install systemd unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: /etc/systemd/system/openclaw-gateway.service
    mode: '0644'
  notify: reload systemd

- name: Enable and start OpenClaw
  ansible.builtin.systemd:
    name: openclaw-gateway
    enabled: true
    state: started
