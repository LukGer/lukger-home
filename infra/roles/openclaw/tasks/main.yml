---
- name: Ensure OpenClaw group exists
  ansible.builtin.group:
    name: "{{ openclaw_group }}"
    state: present

- name: Ensure OpenClaw user exists
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    home: "{{ openclaw_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    system: true

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - golang-go
    state: present
    update_cache: true

- name: Install OpenClaw via official installer (bundles Node.js)
  ansible.builtin.shell: |
    curl -fsSL --proto '=https' --tlsv1.2 https://openclaw.ai/install-cli.sh | bash -s -- --prefix {{ openclaw_install_prefix }} --no-onboard
  args:
    creates: "{{ openclaw_bin_path }}"

- name: Ensure OpenClaw config and workspace dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0755'
  loop:
    - "{{ openclaw_config_dir }}"
    - "{{ openclaw_workspace_dir }}"
    - "{{ openclaw_workspace_dir }}/skills"
    - "{{ openclaw_home }}/.config/gogcli"

- name: Deploy OpenClaw config
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_config_path }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0644'
  notify: restart openclaw

- name: Install custom skills
  ansible.builtin.copy:
    src: "{{ openclaw_skills_src_dir }}/{{ item }}"
    dest: "{{ openclaw_workspace_dir }}/skills/{{ item }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0755'
  loop: "{{ openclaw_skills }}"
  when: openclaw_skills | length > 0
  notify: restart openclaw

- name: Deploy skill config files
  ansible.builtin.template:
    src: "{{ item.value.template }}"
    dest: "{{ item.value.path }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0600'
  loop: "{{ openclaw_skill_configs | dict2items }}"
  when: openclaw_skill_configs | length > 0
  notify: restart openclaw

- name: Deploy gog credentials (vault-encrypted file)
  ansible.builtin.copy:
    src: "{{ openclaw_gog_credentials_src }}"
    dest: "{{ openclaw_home }}/.config/gogcli/credentials.json"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0600'
  notify: restart openclaw

- name: Install blogwatcher binary for OpenClaw user
  ansible.builtin.shell: |
    export GOPATH={{ openclaw_home }}/go
    export PATH=$PATH:{{ openclaw_home }}/go/bin
    go install github.com/Hyaxia/blogwatcher/cmd/blogwatcher@latest
  args:
    creates: "{{ openclaw_home }}/go/bin/blogwatcher"
  become: true
  become_user: "{{ openclaw_user }}"

- name: Initialize blogwatcher with xkcd feed
  ansible.builtin.shell: |
    export GOPATH={{ openclaw_home }}/go
    export PATH=$PATH:{{ openclaw_home }}/go/bin
    {{ openclaw_home }}/go/bin/blogwatcher add "xkcd" https://xkcd.com/rss.xml || true
    {{ openclaw_home }}/go/bin/blogwatcher scan
  args:
    creates: "{{ openclaw_home }}/.blogwatcher/blogwatcher.db"
  become: true
  become_user: "{{ openclaw_user }}"

- name: Install systemd unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: /etc/systemd/system/openclaw-gateway.service
    mode: '0644'
  notify: reload systemd

- name: Enable and start OpenClaw
  ansible.builtin.systemd:
    name: openclaw-gateway
    enabled: true
    state: started
