name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'skills/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible passlib

      - name: Install Galaxy roles
        run: ansible-galaxy install -r requirements.yml
        working-directory: infra

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 69 -H "${{ secrets.TAILSCALE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup vault password
        run: |
          echo -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > infra/.vault_pass
          chmod 600 infra/.vault_pass

      - name: Create CI inventory
        run: |
          cat > infra/hosts.ci << EOF
          [mona]
          lukger-home ansible_host=${{ secrets.TAILSCALE_HOST }} ansible_user=lukger ansible_port=69

          [fleet]
          lukger-home
          EOF

      - name: Run playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: ansible-playbook -i hosts.ci run.yml
        working-directory: infra
